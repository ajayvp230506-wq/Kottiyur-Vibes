<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple App</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f2f2f2;
}

/* LOGIN / REGISTER BOX */
.box{
    width:320px;
    margin:80px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input, button{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

.hidden{display:none;}

/* DASHBOARD */
.dashboard{
    display:none;
    height:100vh;
    color:white;

    background:url("https://images.unsplash.com/photo-1503264116251-35a269479413") no-repeat center;
    background-size:cover;
}

/* TOP BAR */
.topbar{
    background:rgba(0,0,0,0.6);
    padding:15px;
    display:flex;
    justify-content:space-between;
}

/* TABS */
.tabs{
    display:flex;
    background:rgba(0,0,0,0.6);
}

.tabs button{
    flex:1;
    background:none;
    border:none;
    color:white;
    padding:15px;
    cursor:pointer;
}

.tabContent{
    padding:20px;
    background:rgba(0,0,0,0.5);
    height:calc(100vh - 120px);
}

.active{
    background:rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<!-- REGISTER -->
<div id="registerBox" class="box">
    <h2>Register</h2>

    <input type="text" id="name" placeholder="Name">
    <input type="text" id="mobile" placeholder="Mobile">
    <input type="password" id="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="showLogin()">Already Member? Login</button>
</div>

<!-- LOGIN -->
<div id="loginBox" class="box hidden">
    <h2>Login</h2>

    <input type="text" id="loginMobile" placeholder="Mobile">
    <input type="password" id="loginPassword" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="showRegister()">Register</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

    <div class="topbar">
        <div>My Dashboard</div>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button onclick="openTab('home')" class="active">Home</button>
        <button onclick="openTab('profile')">Profile</button>
        <button onclick="openTab('settings')">Settings</button>
    </div>

    <!-- TAB CONTENT -->
    <div class="tabContent">

        <div id="home">🏠 Welcome to Home</div>

        <div id="profile" class="hidden">
            👤 Profile Page
        </div>

        <div id="settings" class="hidden">
            ⚙️ Settings Page
        </div>

    </div>

</div>

<script>

let userData = {};

// REGISTER
function register(){

    let name = document.getElementById("name").value;
    let mobile = document.getElementById("mobile").value;
    let password = document.getElementById("password").value;

    if(name==""||mobile==""||password==""){
        alert("Fill all fields");
        return;
    }

    userData = {name,mobile,password};

    localStorage.setItem("user", JSON.stringify(userData));

    alert("Registered Successfully");

    showLogin();
}

// LOGIN
function login(){

    let mobile = document.getElementById("loginMobile").value;
    let password = document.getElementById("loginPassword").value;

    let user = JSON.parse(localStorage.getItem("user"));

    if(user && user.mobile==mobile && user.password==password){

        document.getElementById("registerBox").style.display="none";
        document.getElementById("loginBox").style.display="none";
        document.getElementById("dashboard").style.display="block";

    }else{
        alert("Invalid Login");
    }
}

// LOGOUT
function logout(){
    location.reload();
}

// SWITCH PAGES
function showLogin(){
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

function showRegister(){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
}

// TABS
function openTab(tab){

    let sections = ["home","profile","settings"];

    sections.forEach(id=>{
        document.getElementById(id).classList.add("hidden");
    });

    document.getElementById(tab).classList.remove("hidden");
}

</script>

</body>
</html>
